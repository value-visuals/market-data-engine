name: Build & Push to Docker Hub

on:
  push:
    branches: ["main", "test"]
  workflow_dispatch: {}

jobs:
  docker:
    runs-on: ubuntu-latest
    environment: DOCKERHUB

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Precheck required secrets
        env:
          _UN: ${{ secrets.DOCKERHUB_UN }}
          _PAT: ${{ secrets.DOCKERHUB_PAT }}
          _REPO: ${{ secrets.DOCKERHUB_REPO }}
        run: |
          [ -n "$_UN" ]   || { echo "::error::Missing secret DOCKERHUB_UN in environment 'DOCKERHUB'"; exit 1; }
          [ -n "$_PAT" ]  || { echo "::error::Missing secret DOCKERHUB_PAT in environment 'DOCKERHUB'"; exit 1; }
          [ -n "$_REPO" ] || { echo "::error::Missing secret DOCKERHUB_REPO in environment 'DOCKERHUB'"; exit 1; }

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_UN }}
          password: ${{ secrets.DOCKERHUB_PAT }}

      - name: Set Docker tag
        run: |
          BRANCH_NAME="${GITHUB_REF#refs/heads/}"

          if [ "$BRANCH_NAME" = "main" ]; then
            TAG="latest"
          elif [ "$BRANCH_NAME" = "test" ]; then
            TAG="test"
          else
            echo "::error::Unsupported deployment branch: $BRANCH_NAME"
            exit 1
          fi

          echo "TAG=$TAG" >> "$GITHUB_ENV"
          echo "Docker tag will be: ${{ secrets.DOCKERHUB_REPO }}:$TAG"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64
          tags: ${{ secrets.DOCKERHUB_REPO }}:${{ env.TAG }}
